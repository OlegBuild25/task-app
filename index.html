<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #1c1c1e;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .header {
      margin-bottom: 24px;
    }

    .header-title {
      font-size: 30px;
      font-weight: 750;
      margin: 0 0 5px;
      letter-spacing: -0.7px;
    }

    .header-subtitle {
      margin: 0;
      font-size: 15px;
      color: #8e8e93;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-button {
      width: 100%;
      min-height: 72px;
      display: flex;
      align-items: center;
      border: none;
      border-radius: 18px;
      background: #ffffff;
      padding: 11px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: 0.12s ease;
    }

    .menu-button:active {
      transform: scale(0.98);
      background: #f7f7f8;
    }

    .icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: 24px;
      margin-right: 14px;
    }

    .blue { background: #e8f2ff; }
    .green { background: #e9f8ef; }
    .yellow { background: #fff7dc; }
    .orange { background: #fff0e5; }
    .purple { background: #f2eaff; }
    .red { background: #ffe9e9; }
    .gray { background: #eeeeF1; }
    .pink { background: #ffeaf3; }

    .menu-text {
      flex: 1;
      text-align: left;
    }

    .menu-title {
      display: block;
      font-size: 17px;
      font-weight: 600;
      color: #202124;
      margin-bottom: 3px;
    }

    .menu-description {
      display: block;
      font-size: 13px;
      color: #9a9aa0;
    }

    .arrow {
      font-size: 29px;
      color: #c7c7cc;
      padding-left: 8px;
    }

    .back-button {
      border: none;
      background: none;
      font-size: 17px;
      color: #2481cc;
      padding: 4px 0;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .page-title {
      font-size: 28px;
      font-weight: 750;
      margin: 0 0 8px;
    }

    .page-description {
      color: #8e8e93;
      font-size: 15px;
      margin: 0 0 20px;
      line-height: 1.4;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #5d5d62;
      margin: 22px 0 10px;
    }

    .employee-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .employee-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .employee-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: #e8f2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .employee-info {
      flex: 1;
    }

    .employee-label {
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 3px;
    }

    .employee-name {
      font-size: 17px;
      font-weight: 700;
    }

    .employee-date {
      font-size: 14px;
      color: #8e8e93;
      margin-top: 4px;
    }

    .object-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .object-button {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .object-button.selected {
      border-color: #2481cc;
      background: #eef7ff;
    }

    .object-check {
      display: none;
      color: #2481cc;
      font-size: 22px;
      font-weight: bold;
    }

    .object-button.selected .object-check {
      display: block;
    }

    .work-type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .work-type-button {
      min-height: 100px;
      border: 2px solid transparent;
      border-radius: 18px;
      background: #ffffff;
      padding: 16px 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .work-icon {
      display: block;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .work-title {
      display: block;
      font-size: 16px;
      font-weight: 700;
    }

    .work-type-button.start.selected {
      border-color: #30a46c;
      background: #edfaf3;
    }

    .work-type-button.finish.selected {
      border-color: #e05d5d;
      background: #fff1f1;
    }

    .time-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-top: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .time-label {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 5px;
    }

    .time-value {
      font-size: 24px;
      font-weight: 750;
    }

    .photo-box {
      min-height: 220px;
      background: #ffffff;
      border: 2px dashed #d1d1d6;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #8e8e93;
      padding: 20px;
      margin: 10px 0 14px;
    }

    .photo-box img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 16px;
    }

    input[type="file"] {
      display: none;
    }

    .action-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 17px;
      color: white;
      font-size: 17px;
      font-weight: 650;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .photo-button {
      background: #2481cc;
    }

    .send-button {
      background: #1f9d62;
    }

    .disabled-button {
      opacity: 0.4;
      cursor: default;
    }

    .success-card {
      display: none;
      background: #edfaf3;
      border: 1px solid #bfe8d0;
      border-radius: 18px;
      padding: 18px;
      margin-top: 18px;
    }

    .success-card.active {
      display: block;
    }

    .success-title {
      font-size: 18px;
      font-weight: 750;
      margin-bottom: 10px;
      color: #157347;
    }

    .success-line {
      font-size: 15px;
      margin: 5px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="mainScreen" class="screen active">

    <div class="header">
      <h1 class="header-title">Task</h1>
      <p class="header-subtitle">Рабочая панель</p>
    </div>

    <div class="menu">

      <button class="menu-button" onclick="openPhotoScreen()">
        <div class="icon blue">📸</div>
        <div class="menu-text">
          <span class="menu-title">Фотоотметка</span>
          <span class="menu-description">Начало и окончание работы</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon green">⚙️</div>
        <div class="menu-text">
          <span class="menu-title">Рабочий процесс</span>
          <span class="menu-description">Задачи и статус работ</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon yellow">💡</div>
        <div class="menu-text">
          <span class="menu-title">База знаний</span>
          <span class="menu-description">Инструкции и материалы</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon blue">⚡</div>
        <div class="menu-text">
          <span class="menu-title">Быстрый отчёт</span>
          <span class="menu-description">Быстро сообщить о работе</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon purple">📝</div>
        <div class="menu-text">
          <span class="menu-title">Дневной отчёт</span>
          <span class="menu-description">Итоги рабочего дня</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon orange">🧾</div>
        <div class="menu-text">
          <span class="menu-title">Счета и фактуры</span>
          <span class="menu-description">Документы и оплаты</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon gray">🏭</div>
        <div class="menu-text">
          <span class="menu-title">Данные поставщиков</span>
          <span class="menu-description">Контакты и информация</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon yellow">⚡</div>
        <div class="menu-text">
          <span class="menu-title">Показания счётчика</span>
          <span class="menu-description">Передать текущие показания</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon blue">👷</div>
        <div class="menu-text">
          <span class="menu-title">Информация о работнике</span>
          <span class="menu-description">Профиль сотрудника</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon red">📍</div>
        <div class="menu-text">
          <span class="menu-title">Смотрер</span>
          <span class="menu-description">Контроль рабочего процесса</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon pink">🎁</div>
        <div class="menu-text">
          <span class="menu-title">Премия</span>
          <span class="menu-description">Бонусы и вознаграждения</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-button">
        <div class="icon purple">🌐</div>
        <div class="menu-text">
          <span class="menu-title">Выбор языка</span>
          <span class="menu-description">Язык приложения</span>
        </div>
        <div class="arrow">›</div>
      </button>

    </div>
  </div>


  <div id="photoScreen" class="screen">

    <button class="back-button" onclick="goBack()">← Назад</button>

    <h2 class="page-title">📸 Фотоотметка</h2>

    <p class="page-description">
      Отметка сотрудника о начале или окончании работы на объекте.
    </p>

    <!-- СОТРУДНИК -->

    <div class="employee-card">

      <div class="employee-row">

        <div class="employee-avatar">👷</div>

        <div class="employee-info">

          <div class="employee-label">Сотрудник</div>

          <div id="employeeName" class="employee-name">
            Олег
          </div>

          <div id="currentDate" class="employee-date">
            —
          </div>

        </div>

      </div>

    </div>


    <div class="section-title">
      1. Выберите объект
    </div>

    <div class="object-list">

      <button class="object-button" onclick="selectObject(this, '1')">
        <span>🏗️ Объект 1</span>
        <span class="object-check">✓</span>
      </button>

      <button class="object-button" onclick="selectObject(this, '2')">
        <span>🏗️ Объект 2</span>
        <span class="object-check">✓</span>
      </button>

      <button class="object-button" onclick="selectObject(this, '3')">
        <span>🏗️ Объект 3</span>
        <span class="object-check">✓</span>
      </button>

    </div>


    <div class="section-title">
      2. Выберите тип отметки
    </div>

    <div class="work-type-grid">

      <button
        class="work-type-button start"
        onclick="selectWorkType(this, 'Начал работу')"
      >
        <span class="work-icon">▶️</span>
        <span class="work-title">Начал работу</span>
      </button>

      <button
        class="work-type-button finish"
        onclick="selectWorkType(this, 'Закончил работу')"
      >
        <span class="work-icon">⏹️</span>
        <span class="work-title">Закончил работу</span>
      </button>

    </div>


    <div class="time-card">

      <div class="time-label">
        Текущее время
      </div>

      <div id="currentTime" class="time-value">
        --:--
      </div>

    </div>


    <div class="section-title">
      3. Сделайте фото
    </div>

    <div class="photo-box" id="photoBox">
      Сначала выберите объект и тип отметки
    </div>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      capture="environment"
      onchange="showPhoto(event)"
    >

    <button
      id="photoButton"
      class="action-button photo-button disabled-button"
      onclick="openCamera()"
      disabled
    >
      📸 Сделать или выбрать фото
    </button>

    <button
      id="sendButton"
      class="action-button send-button disabled-button"
      onclick="sendMark()"
      disabled
    >
      ✓ Отправить отметку
    </button>


    <div id="successCard" class="success-card">

      <div class="success-title">
        ✓ Табельная отметка сохранена
      </div>

      <div id="successEmployee" class="success-line"></div>
      <div id="successDate" class="success-line"></div>
      <div id="successObject" class="success-line"></div>
      <div id="successType" class="success-line"></div>
      <div id="successTime" class="success-line"></div>

    </div>

  </div>

</div>


<script>

  let selectedObject = null;
  let selectedWorkType = null;
  let photoSelected = false;

  // Пока имя задаём вручную.
  // Позже Telegram будет подставлять его автоматически.
  let employeeName = "Олег";

if (
  window.Telegram &&
  window.Telegram.WebApp &&
  window.Telegram.WebApp.initDataUnsafe &&
  window.Telegram.WebApp.initDataUnsafe.user
) {

  const telegramUser =
    window.Telegram.WebApp.initDataUnsafe.user;

  employeeName =
    telegramUser.first_name || "Сотрудник";

  if (telegramUser.last_name) {
    employeeName += " " + telegramUser.last_name;
  }
}


  function formatDate(date) {

    return date.toLocaleDateString(
      "ru-RU",
      {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );
  }


  function formatTime(date) {

    const hours =
      String(date.getHours()).padStart(2, "0");

    const minutes =
      String(date.getMinutes()).padStart(2, "0");

    const seconds =
      String(date.getSeconds()).padStart(2, "0");

    return hours + ":" + minutes + ":" + seconds;
  }


  function updateDateAndTime() {

    const now = new Date();

    document.getElementById("employeeName").innerText =
      employeeName;

    document.getElementById("currentTime").innerText =
      formatTime(now);

    document.getElementById("currentDate").innerText =
      formatDate(now);
  }


  setInterval(updateDateAndTime, 1000);
  updateDateAndTime();


  function openPhotoScreen() {

    document.getElementById("mainScreen")
      .classList.remove("active");

    document.getElementById("photoScreen")
      .classList.add("active");

    updateDateAndTime();

    window.scrollTo(0, 0);
  }


  function goBack() {

    document.getElementById("photoScreen")
      .classList.remove("active");

    document.getElementById("mainScreen")
      .classList.add("active");

    window.scrollTo(0, 0);
  }


  function selectObject(button, objectName) {

    document.querySelectorAll(".object-button")
      .forEach(function(item) {
        item.classList.remove("selected");
      });

    button.classList.add("selected");

    selectedObject = objectName;

    checkPhotoAvailability();
  }


  function selectWorkType(button, workType) {

    document.querySelectorAll(".work-type-button")
      .forEach(function(item) {
        item.classList.remove("selected");
      });

    button.classList.add("selected");

    selectedWorkType = workType;

    checkPhotoAvailability();
  }


  function checkPhotoAvailability() {

    const photoButton =
      document.getElementById("photoButton");

    if (selectedObject && selectedWorkType) {

      photoButton.disabled = false;
      photoButton.classList.remove("disabled-button");

      document.getElementById("photoBox").innerText =
        "Теперь можно сделать фото";

    } else {

      photoButton.disabled = true;
      photoButton.classList.add("disabled-button");
    }
  }


  function openCamera() {

    if (!selectedObject || !selectedWorkType) {
      return;
    }

    document.getElementById("photoInput").click();
  }


  function showPhoto(event) {

    const file = event.target.files[0];

    if (!file) {
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      document.getElementById("photoBox").innerHTML =
        '<img src="' + e.target.result + '">';

      photoSelected = true;

      const sendButton =
        document.getElementById("sendButton");

      sendButton.disabled = false;
      sendButton.classList.remove("disabled-button");
    };

    reader.readAsDataURL(file);
  }


  function sendMark() {

  if (
    !selectedObject ||
    !selectedWorkType ||
    !photoSelected
  ) {
    return;
  }

  const now = new Date();

  const date = formatDate(now);
  const time = formatTime(now);

  let telegramId = null;

  if (
    window.Telegram &&
    window.Telegram.WebApp &&
    window.Telegram.WebApp.initDataUnsafe &&
    window.Telegram.WebApp.initDataUnsafe.user
  ) {
    telegramId =
      window.Telegram.WebApp.initDataUnsafe.user.id;
  }

  const markData = {
    employee: employeeName,
    telegram_id: telegramId,
    object: selectedObject,
    work_type: selectedWorkType,
    date: date,
    time: time
  };

  if (
    window.Telegram &&
    window.Telegram.WebApp
  ) {

    Telegram.WebApp.sendData(
      JSON.stringify(markData)
    );

  } else {

    alert("Отправка работает только внутри Telegram");
  }
}

    const now = new Date();

    const date = formatDate(now);
    const time = formatTime(now);

    document.getElementById("successEmployee").innerText =
      "Сотрудник: " + employeeName;

    document.getElementById("successDate").innerText =
      "Дата: " + date;

    document.getElementById("successObject").innerText =
      "Объект: " + selectedObject;

    document.getElementById("successType").innerText =
      "Отметка: " + selectedWorkType;

    document.getElementById("successTime").innerText =
      "Время: " + time;

    document.getElementById("successCard")
      .classList.add("active");

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });
  }

</script>

</body>
</html>
